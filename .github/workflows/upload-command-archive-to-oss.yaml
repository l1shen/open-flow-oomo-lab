name: Upload Command Archive To OSS

on:
  workflow_call:
    inputs:
      version:
        description: Open Flow version to upload.
        required: true
        type: string
    outputs:
      archive_digest:
        description: SHA-256 digest of the uploaded command archive.
        value: ${{ jobs.upload_command_archive.outputs.archive_digest }}
      archive_length:
        description: Byte length of the uploaded command archive.
        value: ${{ jobs.upload_command_archive.outputs.archive_length }}
      archive_url:
        description: Public CDN URL of the uploaded command archive.
        value: ${{ jobs.upload_command_archive.outputs.archive_url }}
  workflow_dispatch:
    inputs:
      version:
        description: Open Flow version to upload.
        required: true
        type: string

env:
  CDN_BASE_URL: https://static.oomol.com/release/apps/open-flow/command/
  OSS_BUCKET: oomol-static-cn-prod
  OSS_ENDPOINT: https://oss-cn-hangzhou.aliyuncs.com
  OSS_PREFIX: release/apps/open-flow/command
  OSS_REGION: cn-hangzhou
  PINNED_RCLONE_VERSION: v1.69.1

permissions:
  contents: read
  id-token: write

concurrency:
  group: upload-command-archive-to-oss-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  upload_command_archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      archive_digest: ${{ steps.release.outputs.archive_digest }}
      archive_length: ${{ steps.release.outputs.archive_length }}
      archive_url: ${{ steps.release.outputs.archive_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install
        run: bun install --frozen-lockfile

      - name: Verify package
        run: |
          bun run --filter @oomol-lab/open-flow check
          bun run test:package

      - name: Build command release
        id: release
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          package_version="$(jq -er '.version' packages/open-flow/package.json)"
          if [ "$package_version" != "$EXPECTED_VERSION" ]; then
            echo "Open Flow package version $package_version does not match requested version $EXPECTED_VERSION." >&2
            exit 1
          fi

          bun run --filter @oomol-lab/open-flow release:command --cdn-base-url "$CDN_BASE_URL"

          release_record="packages/open-flow/dist/release/open-flow-command-release.json"
          archive_url="$(jq -er '.archive.url' "$release_record")"
          archive_digest="$(jq -er '.archive.digest' "$release_record")"
          archive_length="$(jq -er '.archive.length' "$release_record")"
          open_flow_version="$(jq -er '.openFlowVersion' "$release_record")"
          archive_name="${archive_url##*/}"
          archive_path="packages/open-flow/dist/release/$archive_name"

          if [ "$open_flow_version" != "$EXPECTED_VERSION" ]; then
            echo "Command release version $open_flow_version does not match requested version $EXPECTED_VERSION." >&2
            exit 1
          fi

          actual_digest="$(sha256sum "$archive_path" | cut -d ' ' -f 1)"
          actual_length="$(stat --format='%s' "$archive_path")"
          if [ "$actual_digest" != "$archive_digest" ]; then
            echo "Command archive digest $actual_digest does not match release record digest $archive_digest." >&2
            exit 1
          fi
          if [ "$actual_length" != "$archive_length" ]; then
            echo "Command archive length $actual_length does not match release record length $archive_length." >&2
            exit 1
          fi

          {
            echo "archive_digest=$archive_digest"
            echo "archive_length=$archive_length"
            echo "archive_name=$archive_name"
            echo "archive_path=$archive_path"
            echo "archive_url=$archive_url"
            echo "open_flow_version=$open_flow_version"
            echo "release_record=$release_record"
          } >> "$GITHUB_OUTPUT"

      - name: Configure Alibaba Cloud credentials
        id: aliyun_credentials
        uses: aliyun/configure-aliyun-credentials-action@v1.1.0
        with:
          role-to-assume: ${{ vars.ALIYUN_INTERNAL_ROLE }}
          oidc-provider-arn: ${{ vars.ALIYUN_OIDC_PROVIDER }}
          role-session-name: github-action-session
          role-session-expiration: 1800
          audience: https://github.com/oomol-lab

      - name: Cache rclone
        uses: actions/cache@v5
        with:
          path: ~/.local/bin/rclone
          key: rclone-${{ runner.os }}-${{ env.PINNED_RCLONE_VERSION }}

      - name: Setup rclone
        run: |
          set -euo pipefail

          if [ ! -x "$HOME/.local/bin/rclone" ]; then
            mkdir -p "$HOME/.local/bin"
            curl -fsSL "https://downloads.rclone.org/${PINNED_RCLONE_VERSION}/rclone-${PINNED_RCLONE_VERSION}-linux-amd64.zip" -o /tmp/rclone.zip
            unzip -j /tmp/rclone.zip "rclone-${PINNED_RCLONE_VERSION}-linux-amd64/rclone" -d "$HOME/.local/bin"
            chmod +x "$HOME/.local/bin/rclone"
          fi

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Configure rclone for OSS
        env:
          ALICLOUD_ACCESS_KEY_ID: ${{ steps.aliyun_credentials.outputs.aliyun-access-key-id }}
          ALICLOUD_ACCESS_KEY_SECRET: ${{ steps.aliyun_credentials.outputs.aliyun-access-key-secret }}
          ALICLOUD_SECURITY_TOKEN: ${{ steps.aliyun_credentials.outputs.aliyun-security-token }}
        run: |
          set -euo pipefail

          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [oss]
          type = s3
          provider = Alibaba
          access_key_id = ${ALICLOUD_ACCESS_KEY_ID}
          secret_access_key = ${ALICLOUD_ACCESS_KEY_SECRET}
          endpoint = ${OSS_ENDPOINT}
          region = ${OSS_REGION}
          session_token = ${ALICLOUD_SECURITY_TOKEN}
          EOF

      - name: Upload command archive to OSS
        env:
          ARCHIVE_NAME: ${{ steps.release.outputs.archive_name }}
          ARCHIVE_PATH: ${{ steps.release.outputs.archive_path }}
        run: |
          set -euo pipefail

          rclone copyto \
            "$ARCHIVE_PATH" \
            "oss:${OSS_BUCKET}/${OSS_PREFIX}/${ARCHIVE_NAME}" \
            --immutable \
            --s3-no-check-bucket \
            --size-only \
            --progress \
            --retries 5 \
            --retries-sleep 10s \
            --low-level-retries 10

      - name: Verify command archive through CDN
        env:
          ARCHIVE_DIGEST: ${{ steps.release.outputs.archive_digest }}
          ARCHIVE_LENGTH: ${{ steps.release.outputs.archive_length }}
          ARCHIVE_NAME: ${{ steps.release.outputs.archive_name }}
          ARCHIVE_URL: ${{ steps.release.outputs.archive_url }}
        run: |
          set -euo pipefail

          downloaded_archive="${RUNNER_TEMP}/${ARCHIVE_NAME}"
          curl \
            --fail \
            --location \
            --output "$downloaded_archive" \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 10 \
            --show-error \
            --silent \
            "$ARCHIVE_URL"

          actual_digest="$(sha256sum "$downloaded_archive" | cut -d ' ' -f 1)"
          actual_length="$(stat --format='%s' "$downloaded_archive")"
          if [ "$actual_digest" != "$ARCHIVE_DIGEST" ]; then
            echo "CDN command archive digest $actual_digest does not match the release record." >&2
            exit 1
          fi
          if [ "$actual_length" != "$ARCHIVE_LENGTH" ]; then
            echo "CDN command archive length $actual_length does not match the release record." >&2
            exit 1
          fi

      - name: Upload command release record
        uses: actions/upload-artifact@v7.0.1
        with:
          name: open-flow-command-release-${{ steps.release.outputs.open_flow_version }}
          path: ${{ steps.release.outputs.release_record }}
          if-no-files-found: error

      - name: Summarize command release
        env:
          ARCHIVE_DIGEST: ${{ steps.release.outputs.archive_digest }}
          ARCHIVE_LENGTH: ${{ steps.release.outputs.archive_length }}
          ARCHIVE_URL: ${{ steps.release.outputs.archive_url }}
          OPEN_FLOW_VERSION: ${{ steps.release.outputs.open_flow_version }}
        run: |
          {
            echo "## Open Flow command release"
            echo
            echo "- Version: \`$OPEN_FLOW_VERSION\`"
            echo "- URL: \`$ARCHIVE_URL\`"
            echo "- Length: \`$ARCHIVE_LENGTH\` bytes"
            echo "- SHA-256: \`$ARCHIVE_DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
