title: Inline Greeting
description: A Subflow with an inline Node.js Task.
private: false
inputs_def:
  - handle: name
    json_schema:
      type: string
outputs_def:
  - handle: message
    json_schema:
      type: string
nodes:
  - node_id: format-message
    title: Format message
    description: Formats the greeting inside the Subflow.
    task:
      inputs_def:
        - handle: name
          json_schema:
            type: string
      outputs_def:
        - handle: message
          json_schema:
            type: string
      executor:
        name: javascript
        options:
          entry: ../../tasks/greet/main.ts
    inputs_from:
      - handle: name
        from_flow:
          - input_handle: name
outputs_from:
  - handle: message
    from_node:
      - node_id: format-message
        output_handle: message
